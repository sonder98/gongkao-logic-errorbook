<title id="title">图1 2020年2—12月J省累计发电量及同比增速</title>
<desc id="desc">累计发电量单位亿千瓦时，折线为同比增速百分比。月份依次为1-2月、1-3月、1-4月、1-5月、1-6月、1-7月、1-8月、1-9月、1-10月、1-11月、1-12月；发电量分别为155.4、228.6、299.8、376.8、450.8、534.1、612、690.9、765.8、852.8、944.7；同比增速分别为2.5、0.2、0.7、2.8、3.1、3.8、3.6、5.3、5.5、6.2、5.9%。</desc>

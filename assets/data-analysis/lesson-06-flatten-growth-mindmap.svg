<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="mindmapTitle mindmapDesc">
<title id="mindmapTitle">第6课｜拉平增长率思维导图</title><desc id="mindmapDesc">按照基期比、基期比较、增量比较、基期和差四个主干梳理公式、适用场景和考场速算流程。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;letter-spacing:.1px} text{paint-order:stroke fill}</style>
<rect x="0" y="0" width="1440" height="1120" rx="0" fill="#fff" stroke="none" stroke-width="1"/>
<rect x="23" y="60" width="679" height="396" rx="27" fill="#f7f3ff" stroke="#8b68d1" stroke-width="3"/>
<rect x="41" y="45" width="298" height="51" rx="22" fill="#8b68d1" stroke="#8b68d1" stroke-width="0"/>
<text x="63" y="79" font-size="28" fill="#fff" font-weight="700" text-anchor="start">▥</text>
<text x="106" y="78" font-size="29" fill="#fff" font-weight="800" text-anchor="start">01 基期比</text>
<rect x="740" y="60" width="678" height="396" rx="27" fill="#f1fcf2" stroke="#59b66c" stroke-width="3"/>
<rect x="758" y="45" width="298" height="51" rx="22" fill="#59b66c" stroke="#59b66c" stroke-width="0"/>
<text x="780" y="79" font-size="28" fill="#fff" font-weight="700" text-anchor="start">⚖</text>
<text x="823" y="78" font-size="29" fill="#fff" font-weight="800" text-anchor="start">02 基期比较</text>
<rect x="23" y="535" width="679" height="430" rx="27" fill="#f0f7ff" stroke="#3c97d8" stroke-width="3"/>
<rect x="41" y="520" width="298" height="51" rx="22" fill="#3c97d8" stroke="#3c97d8" stroke-width="0"/>
<text x="63" y="554" font-size="28" fill="#fff" font-weight="700" text-anchor="start">▥</text>
<text x="106" y="553" font-size="29" fill="#fff" font-weight="800" text-anchor="start">03 增量比较</text>
<rect x="740" y="535" width="678" height="430" rx="27" fill="#fff6ee" stroke="#ed8e43" stroke-width="3"/>
<rect x="758" y="520" width="298" height="51" rx="22" fill="#ed8e43" stroke="#ed8e43" stroke-width="0"/>
<text x="780" y="554" font-size="28" fill="#fff" font-weight="700" text-anchor="start">Σ</text>
<text x="823" y="553" font-size="29" fill="#fff" font-weight="800" text-anchor="start">04 基期和差</text>
<rect x="44" y="112" width="634" height="35" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="50" y="115" width="106" height="29" rx="12" fill="#efe5ff" stroke="#7952c4" stroke-width="1"/>
<text x="103" y="136" font-size="17" fill="#7952c4" font-weight="750" text-anchor="middle">适用</text>
<text x="168" y="137" font-size="17" fill="#24313c" font-weight="500" text-anchor="start">已知 A、B 和各自增速 r₁、r₂，求对应基期比 a/b</text>
<rect x="44" y="154" width="634" height="36" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="50" y="157" width="106" height="29" rx="12" fill="#efe5ff" stroke="#7952c4" stroke-width="1"/>
<text x="103" y="178" font-size="17" fill="#7952c4" font-weight="750" text-anchor="middle">第一步</text>
<text x="168" y="180" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">判断哪一方的增长率较低</text>
<rect x="44" y="197" width="634" height="86" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="50" y="199" width="106" height="29" rx="12" fill="#efe5ff" stroke="#7952c4" stroke-width="1"/>
<text x="103" y="220" font-size="17" fill="#7952c4" font-weight="750" text-anchor="middle">第二步</text>
<text x="167" y="222" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">给增速较低的一方补正（大减小）</text>
<circle cx="183" cy="245" r="4.1" fill="#8b68d1"/>
<text x="198" y="250" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">r₁＞r₂：补分母，r补＝(r₁−r₂)/(1＋r₂)</text>
<circle cx="183" cy="270" r="4.1" fill="#8b68d1"/>
<text x="198" y="275" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">r₁＜r₂：补分子，r补＝(r₂−r₁)/(1＋r₁)</text>
<rect x="44" y="292" width="634" height="75" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="50" y="295" width="106" height="29" rx="12" fill="#efe5ff" stroke="#7952c4" stroke-width="1"/>
<text x="103" y="316" font-size="17" fill="#7952c4" font-weight="750" text-anchor="middle">第三步</text>
<text x="167" y="316" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">选择计算顺序</text>
<circle cx="182" cy="337" r="4.1" fill="#8b68d1"/>
<text x="197" y="342" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">A/B 好算 → 先除后补；不好算 → 先补后除</text>
<rect x="44" y="376" width="634" height="41" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="50" y="381" width="106" height="29" rx="12" fill="#efe5ff" stroke="#7952c4" stroke-width="1"/>
<text x="103" y="402" font-size="17" fill="#7952c4" font-weight="750" text-anchor="middle">速判 TIP</text>
<text x="168" y="393" font-size="16" fill="#24313c" font-weight="500" text-anchor="start">A/B 易凑整或有倍数关系 → 先算现期比</text>
<text x="168" y="412" font-size="16" fill="#24313c" font-weight="500" text-anchor="start">修正率好算（10%、25%、33%）→ 先补</text>
<rect x="45" y="426" width="510" height="24" rx="9" fill="#fff8dd" stroke="#ecce75" stroke-width="1"/>
<text x="65" y="445" font-size="16" fill="#5f4a2c" font-weight="700" text-anchor="start">核心：基期比＝现期比×修正；始终补低增速一方</text>
<rect x="760" y="112" width="640" height="38" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="766" y="117" width="106" height="29" rx="12" fill="#e0f6df" stroke="#348d49" stroke-width="1"/>
<text x="819" y="138" font-size="17" fill="#348d49" font-weight="750" text-anchor="middle">题型</text>
<text x="888" y="139" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">比较两个量的基期谁大谁小</text>
<rect x="760" y="158" width="640" height="117" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="766" y="169" width="106" height="29" rx="12" fill="#e0f6df" stroke="#348d49" stroke-width="1"/>
<text x="819" y="190" font-size="17" fill="#348d49" font-weight="750" text-anchor="middle">情况一</text>
<text x="891" y="189" font-size="19" fill="#263a31" font-weight="700" text-anchor="start">现期大小与增速大小不同边</text>
<circle cx="891" cy="211" r="4.1" fill="#45b85e"/>
<text x="906" y="216" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">现期大、增速小 → 基期更大</text>
<circle cx="891" cy="236" r="4.1" fill="#45b85e"/>
<text x="906" y="241" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">现期小、增速大 → 基期更小</text>
<text x="908" y="264" font-size="16" fill="#348d49" font-weight="650" text-anchor="start">无需修正，直接判断。</text>
<rect x="760" y="284" width="640" height="84" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="766" y="292" width="106" height="29" rx="12" fill="#e0f6df" stroke="#348d49" stroke-width="1"/>
<text x="819" y="313" font-size="17" fill="#348d49" font-weight="750" text-anchor="middle">情况二</text>
<text x="891" y="312" font-size="19" fill="#263a31" font-weight="700" text-anchor="start">现期大小与增速大小同边</text>
<circle cx="891" cy="332" r="4.1" fill="#45b85e"/>
<text x="906" y="337" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">补正低增速的一方，再判断能否追上</text>
<circle cx="891" cy="357" r="4.1" fill="#45b85e"/>
<text x="906" y="362" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">直接看补正后比值是否超过 1</text>
<rect x="760" y="376" width="640" height="40" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="766" y="382" width="106" height="29" rx="12" fill="#e0f6df" stroke="#348d49" stroke-width="1"/>
<text x="819" y="403" font-size="17" fill="#348d49" font-weight="750" text-anchor="middle">速算思想</text>
<text x="886" y="402" font-size="17" fill="#24313c" font-weight="500" text-anchor="start">补正幅度明显小于现期差距 → 直接判定</text>
<rect x="771" y="425" width="620" height="26" rx="8" fill="#e8f9e8" stroke="#71bf7c" stroke-width="1"/>
<text x="788" y="443" font-size="16" fill="#267d3b" font-weight="650" text-anchor="start">例：现期差约 10%，修正仅 3.2% → 补不回来</text>
<rect x="43" y="588" width="637" height="163" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="53" y="599" width="132" height="139" rx="12" fill="#e2f1ff" stroke="#8fbcea" stroke-width="1"/>
<text x="68" y="644" font-size="21" fill="#235aa3" font-weight="800" text-anchor="start">A. 增量</text>
<text x="68" y="681" font-size="21" fill="#235aa3" font-weight="800" text-anchor="start">倍数比较</text>
<circle cx="203" cy="610" r="4.1" fill="#398dcd"/>
<text x="218" y="615" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">方法一：分别计算增长量</text>
<rect x="222" y="622" width="400" height="30" rx="9" fill="#fff9e4" stroke="#eed68d" stroke-width="1"/>
<text x="233" y="644" font-size="20" fill="#273747" font-weight="650" text-anchor="start">增长量＝现期 × r/(1＋r)</text>
<text x="223" y="676" font-size="16" fill="#24313c" font-weight="500" text-anchor="start">增速小：化除为乘；接近百化分：份数法</text>
<circle cx="203" cy="700" r="4.1" fill="#398dcd"/>
<text x="218" y="705" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">方法二：基期比 × 增速比</text>
<rect x="222" y="711" width="414" height="30" rx="9" fill="#fff9e4" stroke="#eed68d" stroke-width="1"/>
<text x="233" y="733" font-size="18" fill="#273747" font-weight="650" text-anchor="start">增长量之比＝基期比 × (r₁/r₂)</text>
<rect x="43" y="761" width="637" height="170" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="53" y="775" width="132" height="142" rx="12" fill="#e2f1ff" stroke="#8fbcea" stroke-width="1"/>
<text x="68" y="819" font-size="21" fill="#235aa3" font-weight="800" text-anchor="start">B. 增量</text>
<text x="68" y="856" font-size="21" fill="#235aa3" font-weight="800" text-anchor="start">大小比较</text>
<circle cx="203" cy="783" r="4.1" fill="#398dcd"/>
<text x="218" y="788" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">同边：大大则大（正增长）</text>
<rect x="222" y="796" width="412" height="30" rx="9" fill="#fff9e4" stroke="#eed68d" stroke-width="1"/>
<text x="233" y="818" font-size="17" fill="#273747" font-weight="650" text-anchor="start">ΔA＝A×r₁/(1＋r₁)＝A/(1/r₁＋1)</text>
<circle cx="203" cy="845" r="4.1" fill="#398dcd"/>
<text x="218" y="850" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">不同边：比较基期比与反向增速比</text>
<text x="223" y="879" font-size="16" fill="#283f59" font-weight="500" text-anchor="start">若 A＞B、r₁＜r₂：先粗比 A/B 与 r₂/r₁</text>
<text x="223" y="905" font-size="16" fill="#283f59" font-weight="500" text-anchor="start">结果接近或增速较大时，修正基期比再判断</text>
<rect x="52" y="939" width="618" height="21" rx="6" fill="#dfefff" stroke="#b8d5f1" stroke-width="0"/>
<text x="70" y="954" font-size="15" fill="#2867a8" font-weight="600" text-anchor="start">提示：大小比较通常只需比较大小，不必求精确倍数</text>
<rect x="761" y="588" width="636" height="36" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="767" y="592" width="106" height="29" rx="12" fill="#ffecd8" stroke="#d87728" stroke-width="1"/>
<text x="820" y="613" font-size="17" fill="#d87728" font-weight="750" text-anchor="middle">题型</text>
<text x="893" y="614" font-size="19" fill="#24313c" font-weight="500" text-anchor="start">求基期和 / 基期差（多数求差）</text>
<rect x="761" y="632" width="636" height="125" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="771" y="643" width="133" height="103" rx="12" fill="#ffe7d3" stroke="#eca673" stroke-width="1"/>
<text x="788" y="677" font-size="18" fill="#bb631e" font-weight="800" text-anchor="start">方法一</text>
<text x="788" y="705" font-size="18" fill="#bb631e" font-weight="800" text-anchor="start">增量容易计算</text>
<rect x="918" y="648" width="456" height="30" rx="9" fill="#fff8df" stroke="#eac783" stroke-width="1"/>
<text x="929" y="670" font-size="18" fill="#273747" font-weight="650" text-anchor="start">基期差＝(A−B)−(a−b)</text>
<rect x="918" y="690" width="456" height="30" rx="9" fill="#fff8df" stroke="#eac783" stroke-width="1"/>
<text x="929" y="712" font-size="18" fill="#273747" font-weight="650" text-anchor="start">基期和＝(A＋B)−(a＋b)</text>
<text x="932" y="746" font-size="16" fill="#886544" font-weight="500" text-anchor="start">注：这里 a、b 表示增长量</text>
<rect x="761" y="766" width="636" height="165" rx="12" fill="#fff" stroke="#e2e7ec" stroke-width="1"/>
<rect x="771" y="779" width="133" height="141" rx="12" fill="#ffe7d3" stroke="#eca673" stroke-width="1"/>
<text x="787" y="813" font-size="18" fill="#bb631e" font-weight="800" text-anchor="start">方法二</text>
<text x="787" y="842" font-size="18" fill="#bb631e" font-weight="800" text-anchor="start">拉平增长率</text>
<circle cx="921" cy="787" r="4.1" fill="#e88733"/>
<text x="936" y="792" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">r₁＞r₂：补正 B</text>
<rect x="937" y="798" width="440" height="30" rx="9" fill="#fff8df" stroke="#eac783" stroke-width="1"/>
<text x="948" y="820" font-size="15" fill="#273747" font-weight="650" text-anchor="start">基期差＝[A−B×(1＋(r₁−r₂)/(1＋r₂))]/(1＋r₁)</text>
<circle cx="921" cy="847" r="4.1" fill="#e88733"/>
<text x="936" y="852" font-size="18" fill="#24313c" font-weight="500" text-anchor="start">r₂＞r₁：补正 A</text>
<rect x="937" y="857" width="440" height="30" rx="9" fill="#fff8df" stroke="#eac783" stroke-width="1"/>
<text x="948" y="879" font-size="15" fill="#273747" font-weight="650" text-anchor="start">基期差＝[A×(1＋(r₂−r₁)/(1＋r₁))−B]/(1＋r₂)</text>
<circle cx="921" cy="904" r="4.1" fill="#e88733"/>
<text x="936" y="909" font-size="16" fill="#24313c" font-weight="500" text-anchor="start">求和：统一分子中的减法改为加法</text>
<rect x="767" y="937" width="626" height="24" rx="8" fill="#ffecd8" stroke="#eead6d" stroke-width="1"/>
<text x="786" y="954" font-size="15" fill="#ac651b" font-weight="720" text-anchor="start">关键：不是补现期比，而是直接补现期量 A 或 B</text>
<path d="M 701 469 L 701 489 L 622 489" fill="none" stroke="#8b68d1" stroke-width="5" stroke-linecap="round"/>
<path d="M 741 469 L 741 489 L 825 489" fill="none" stroke="#54aa62" stroke-width="5" stroke-linecap="round"/>
<rect x="531" y="460" width="378" height="73" rx="31" fill="#fff9de" stroke="#e4b839" stroke-width="4"/>
<text x="720" y="486" font-size="27" fill="#192737" font-weight="820" text-anchor="middle">第6课｜拉平增长率</text>
<text x="720" y="516" font-size="17" fill="#53606a" font-weight="650" text-anchor="middle">从现期推基期 · 比较 · 增量 · 和差</text>
<rect x="24" y="984" width="1393" height="121" rx="18" fill="#f9f9ff" stroke="#8a8fdb" stroke-width="2"/>
<rect x="31" y="992" width="185" height="104" rx="17" fill="#2865ad" stroke="#2865ad" stroke-width="0"/>
<text x="122" y="1033" font-size="25" fill="#fff" font-weight="820" text-anchor="middle">做题</text>
<text x="122" y="1067" font-size="25" fill="#fff" font-weight="820" text-anchor="middle">总流程</text>
<rect x="236" y="999" width="216" height="90" rx="14" fill="#fff" stroke="#7651be" stroke-width="1.5"/>
<circle cx="262" cy="1023" r="17" fill="#7651be"/>
<text x="262" y="1030" font-size="22" fill="#fff" font-weight="790" text-anchor="middle">1</text>
<text x="347" y="1029" font-size="18" fill="#202f3d" font-weight="750" text-anchor="middle">先判题型</text>
<text x="344" y="1057" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">基期比／比较</text>
<text x="344" y="1078" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">增量／和差</text>
<text x="459" y="1050" font-size="34" fill="#7651be" font-weight="800" text-anchor="middle">›</text>
<rect x="470" y="999" width="216" height="90" rx="14" fill="#fff" stroke="#447ab2" stroke-width="1.5"/>
<circle cx="496" cy="1023" r="17" fill="#447ab2"/>
<text x="496" y="1030" font-size="22" fill="#fff" font-weight="790" text-anchor="middle">2</text>
<text x="581" y="1029" font-size="18" fill="#202f3d" font-weight="750" text-anchor="middle">看现期与增速</text>
<text x="578" y="1057" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">同边／不同边</text>
<text x="693" y="1050" font-size="34" fill="#447ab2" font-weight="800" text-anchor="middle">›</text>
<rect x="704" y="999" width="216" height="90" rx="14" fill="#fff" stroke="#4c9e65" stroke-width="1.5"/>
<circle cx="730" cy="1023" r="17" fill="#4c9e65"/>
<text x="730" y="1030" font-size="22" fill="#fff" font-weight="790" text-anchor="middle">3</text>
<text x="815" y="1029" font-size="18" fill="#202f3d" font-weight="750" text-anchor="middle">决定补正</text>
<text x="812" y="1057" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">始终补增速较低</text>
<text x="812" y="1078" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">的一方</text>
<text x="927" y="1050" font-size="34" fill="#4c9e65" font-weight="800" text-anchor="middle">›</text>
<rect x="938" y="999" width="216" height="90" rx="14" fill="#fff" stroke="#db8c3d" stroke-width="1.5"/>
<circle cx="964" cy="1023" r="17" fill="#db8c3d"/>
<text x="964" y="1030" font-size="22" fill="#fff" font-weight="790" text-anchor="middle">4</text>
<text x="1049" y="1029" font-size="18" fill="#202f3d" font-weight="750" text-anchor="middle">选择计算顺序</text>
<text x="1046" y="1057" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">先除后补／先补后除</text>
<text x="1046" y="1078" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">或直接算增量</text>
<text x="1161" y="1050" font-size="34" fill="#db8c3d" font-weight="800" text-anchor="middle">›</text>
<rect x="1172" y="999" width="216" height="90" rx="14" fill="#fff" stroke="#8a63b4" stroke-width="1.5"/>
<circle cx="1198" cy="1023" r="17" fill="#8a63b4"/>
<text x="1198" y="1030" font-size="22" fill="#fff" font-weight="790" text-anchor="middle">5</text>
<text x="1283" y="1029" font-size="18" fill="#202f3d" font-weight="750" text-anchor="middle">结合选项</text>
<text x="1280" y="1057" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">优先速算与</text>
<text x="1280" y="1078" font-size="15" fill="#405160" font-weight="540" text-anchor="middle">差距判断</text>
</svg>
name: Academic UI browser smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'academic-theme.css'
      - 'single-scroll.css'
      - 'single-scroll.js'
      - 'data-analysis.js'
      - 'tests/academic-ui-browser.cjs'
      - 'tests/compact-editorial-browser.cjs'
      - 'tests/repeat-practice-browser.cjs'
      - 'practice-session.js'
      - 'cloud-sync.js'
      - 'tests/cloud-sync-browser.cjs'
      - 'scratch-overlay.js'
      - 'scratch-overlay.css'
      - 'tests/fullscreen-scratch-browser.cjs'
      - 'swipe-navigation.js'
      - 'tests/mobile-gestures-browser.cjs'
      - 'tests/knowledge-swipe-browser.cjs'
      - 'device-position.js'
      - 'knowledge-sheet.js'
      - 'tests/knowledge-sheet-browser.cjs'
      - 'tests/device-resume-browser.cjs'
      - '.github/workflows/academic-ui-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Run focused Academic Edition browser checks
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/exam-browser.log 2>&1 &
          sleep 2
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/cloud-sync-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/academic-ui-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/compact-editorial-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/repeat-practice-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/mobile-gestures-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/knowledge-swipe-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/knowledge-sheet-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/device-resume-browser.cjs
          TEST_URL=http://127.0.0.1:8000/ BROWSER_CHANNEL=chrome node tests/fullscreen-scratch-browser.cjs

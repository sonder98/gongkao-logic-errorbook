name: Validate study data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate logic and data analysis
        run: |
          node tests/validate-questions.cjs
          node tests/validate-knowledge.cjs
          node tests/validate-data-analysis.cjs
          node tests/validate-pwa.cjs
